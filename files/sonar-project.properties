# SonarQube／SonarCloud 掃描設定。
#
# tests/env-stub.mjs 是測試用的假瀏覽器環境（假 window/document/MediaQuery
# 等），裡面大量「刻意」的空方法（S1186）、把 this 賦值給區域變數
# （S7740）、forEach 直接傳函式參考（S7727）等寫法，都是 mock/stub 常見
# 且必要的模式（見檔案開頭的說明），不是真正的程式碼品質問題，改寫反而
# 會讓測試邏輯更難懂、更容易在改動時壞掉。整份檔案排除在分析範圍外，
# 不逐條 issue.ignore（規則多達 7 種、逐條維護成本高，且新增 mock 方法
# 時很容易漏加規則）。
sonar.exclusions=tests/env-stub.mjs
