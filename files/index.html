<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臺灣百年歷史地圖疊圖器</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="map"></div>

<button type="button" id="locateBtn" class="locate-btn" title="定位到目前位置">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
  </svg>
</button>
<div id="locateToast" class="locate-toast"></div>
<div id="locateMarker" class="locate-marker"><div class="locate-marker-dot"></div></div>
<div id="addressMarker" class="address-marker"><div class="address-marker-pin"></div></div>

<div class="floating-opacity" id="floatingOpacity">
  <span class="field-label">透明度</span>
  <input type="range" id="floatingOpacitySlider" min="0" max="100" value="80">
  <span class="opacity-val" id="floatingOpacityVal">80%</span>
</div>

<div class="compare-float-item" id="compareWrapA">
  <span class="side-dot a"></span>
  <div class="layer-picker">
    <button type="button" class="layer-picker-btn" id="pickerBtnA">
      <span class="picker-btn-label" id="pickerLabelA"></span>
      <span class="picker-btn-arrow">▾</span>
    </button>
    <div class="layer-picker-panel" id="pickerPanelA"></div>
  </div>
</div>
<div class="compare-float-item" id="compareWrapB">
  <span class="side-dot b"></span>
  <div class="layer-picker">
    <button type="button" class="layer-picker-btn" id="pickerBtnB">
      <span class="picker-btn-label" id="pickerLabelB"></span>
      <span class="picker-btn-arrow">▾</span>
    </button>
    <div class="layer-picker-panel" id="pickerPanelB"></div>
  </div>
</div>
<div id="swipeDivider">
  <div id="swipeLine"></div>
  <div id="swipeHandle">⇔</div>
</div>

<div id="stamp">
  <div class="stamp-year" id="stampYear"></div>
  <div class="stamp-label" id="stampLabel"></div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-header-text">
      <h1>臺灣百年<br>歷史地圖疊圖器</h1>
      <p>中央研究院 GIS 專題中心 · WMTS</p>
    </div>
    <button id="toggleSidebar" title="收合面板">◂</button>
  </div>

  <div class="sidebar-body">
    <div class="opacity-block" id="opacityBlock">
      <div class="field-label">歷史圖層透明度</div>
      <div class="opacity-row">
        <input type="range" id="opacitySlider" min="0" max="100" value="80">
        <span class="opacity-val" id="opacityVal">80%</span>
      </div>
      <button class="clear-btn" id="clearBtn">清除疊圖</button>
    </div>

    <div class="search-block">
      <div class="field-label">搜尋地址</div>
      <div class="search-row">
        <input type="text" id="addressInput" class="address-input" placeholder="輸入地址、地標或路口" autocomplete="off">
        <button type="button" id="locateSearchBtn" class="address-search-btn locate-search-btn" title="使用目前位置尋找圖層">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          </svg>
        </button>
        <button type="button" id="addressSearchBtn" class="address-search-btn" title="搜尋地址">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>
          </svg>
        </button>
      </div>
      <div id="addressSuggest" class="address-suggest"></div>
      <div id="locationResult" class="location-result" style="display:none;">
        <div class="location-result-head">
          <span id="locationName" class="location-name"></span>
          <button type="button" id="clearLocationBtn" class="location-clear-btn" title="清除搜尋">✕</button>
        </div>
        <div id="layerAvailPanel" class="layer-avail-panel"></div>
      </div>
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button data-mode="overlay" class="active">透明疊圖</button>
      <button data-mode="compare">左右比對</button>
    </div>

    <div id="overlayPanel">
      <div class="field-label">底圖</div>
      <div class="segmented" id="baseSwitch">
        <button data-base="osm" class="active">現代地圖</button>
        <button data-base="sat">衛星影像</button>
      </div>

      <div id="categories"></div>
    </div>

    <div id="comparePanel">
      <p class="compare-hint">左右兩側要比對的圖層選單已移到地圖下方，收合側邊欄也能直接切換。拖曳地圖上的圓形把手，左右滑動比對兩個圖層的差異，任何底圖或歷史圖層都可以自由搭配。</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
